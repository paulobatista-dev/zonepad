[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zonepad"
version = "0.1.0"
description = "Calibração de controles no Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
  "pytest>=9.1",
  "ruff>=0.17.2",
  "mypy>=2.4",
  "virtualenv>=21.14",
]

[project.scripts]
zonepad = "zonepad.interface.cli:main"
zonepad-gui = "zonepad.interface.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zonepad.infrastructure" = ["catalog_data/*.json"]

[tool.mypy]
python_version = "3.15"
strict = false
ignore_missing_imports = true
files = ["src/zonepad"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
