name: ai-assets

on:
  push:
    paths:
      - "ai/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "constraints/**"
      - "packaging/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".tool-versions"
      - ".github/workflows/ai-assets.yml"
  pull_request:
    paths:
      - "ai/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "constraints/**"
      - "packaging/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".tool-versions"
      - ".github/workflows/ai-assets.yml"
  workflow_dispatch:

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/dev.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.0"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/dev.txt
      - name: Instalar projeto e ferramentas
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Tipos
        run: python -m mypy src/zonepad
      - name: Testes de metadados de packaging
        run: python -m pytest tests/test_packaging.py -q
      - name: Verificar espelhamento
        run: python scripts/sync_ai_assets.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar runtime Qt para execução offscreen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.0"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/dev.txt
      - name: Instalar projeto com GUI e ferramentas
        run: python -m pip install -e '.[dev,gui]'
      - name: Confirmar PySide6
        run: python -c "import PySide6; print(PySide6.__version__)"
      - name: Suíte completa com cobertura de linhas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov=zonepad --cov-report=term-missing --cov-report=xml -o addopts=""
      - name: Testes GUI e relatório JUnit
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui.py -o addopts="" --junitxml=gui-junit.xml
      - name: Exigir zero testes GUI ignorados
        run: |
          python -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse("gui-junit.xml").getroot(); skipped=sum(int(s.get("skipped", 0)) for s in ([root] if root.tag == "testsuite" else root.findall("testsuite"))); print(f"GUI skipped: {skipped}"); sys.exit(skipped != 0)'
      - name: Verificar dependências
        run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: line-coverage
          path: coverage.xml
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar runtime Qt para smoke offscreen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.0"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/dev.txt
      - name: Instalar ferramentas de build
        run: python -m pip install -e '.[dev]'
      - name: Construir wheel e sdist com isolamento
        run: python -m build
      - name: Inspecionar conteúdo e metadados
        run: python scripts/check_distribution.py dist
      - name: Criar ambiente descartável sem GUI
        run: python -m venv dist/smoke-venv
      - name: Instalar wheel e validar CLI sem GUI
        run: |
          dist/smoke-venv/bin/python -m pip install dist/zonepad-0.1.0-py3-none-any.whl
          dist/smoke-venv/bin/zonepad --help
          dist/smoke-venv/bin/zonepad devices --help
          set +e
          dist/smoke-venv/bin/zonepad-gui --smoke >gui-no-extra.log 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "instale com" gui-no-extra.log
          ! grep -q "Traceback" gui-no-extra.log
      - name: Instalar wheel com extra GUI e validar smoke offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/smoke-venv/bin/python -m pip install 'dist/zonepad-0.1.0-py3-none-any.whl[gui]'
          dist/smoke-venv/bin/zonepad-gui --smoke
          dist/smoke-venv/bin/python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/zonepad-0.1.0*
          if-no-files-found: error
